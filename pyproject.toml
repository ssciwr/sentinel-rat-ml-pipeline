[project]
name = "sentinel-rat-ml-pipeline"
version = "0.1.0"
requires-python = ">=3.13"
description = "FastAPI microservice for animal detection and species classification"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
authors = [
    { name="Harald Mack", email="ssc@iwr.uni-heidelberg.de" },
    { name="Tuyen Le", email="ssc@iwr.uni-heidelberg.de" },
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "ultralytics>=8.4.215",
    "huggingface_hub>=1.0",
    "pyyaml>=6.0",
    "speciesnet>=5.0.6",
    # huggingface_hub's HTTP client; models catch its network errors (also used by fastapi.testclient)
    "httpx2>=2.13.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# the import package (ml_pipeline) differs from the project name
[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "speciesnet_integration: opt-in test using real SpeciesNet inference and model weights (set RUN_SPECIESNET_INTEGRATION=1)",
]

# opencv: ultralytics requires the GUI build `opencv-python`, speciesnet (-> yolov5 -> roboflow) the
# `opencv-python-headless` build; both install the same `cv2` module. The override drops the GUI
# build (it needs X11/GL system libraries and is never used: no windows on a server), so `cv2` is
# always the headless build. Headless 5.1.0.95 ships no linux wheels, hence the 5.0.x constraint.
# required-environments makes `uv lock` fail early if linux x86_64 (CI, server) loses wheels.
[tool.uv]
override-dependencies = ["opencv-python; sys_platform == 'never'"]
constraint-dependencies = ["opencv-python-headless>=5.0,<5.1"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# Inference runs on CPU only (no GPU on the server), so torch/torchvision come from the
# CPU-only PyTorch index instead of PyPI, whose linux wheels pull in ~45 nvidia-* CUDA packages.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
